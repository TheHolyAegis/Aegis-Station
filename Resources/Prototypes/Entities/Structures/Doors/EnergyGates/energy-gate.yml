# Genpop
- type: entity
  id: EnergyGateGenpopEnter
  parent: EnergyGate
  suffix: Genpop Enter
  components:
  - type: AccessReader
    access: [["GenpopEnter"], ["Security"]]

- type: entity
  id: EnergyGateGenpopLeave
  parent: EnergyGate
  suffix: Genpop Leave
  components:
  - type: AccessReader
    access: [["GenpopLeave"], ["Security"]]

# Airtight
- type: entity
  id: EnergyGateAirtight
  parent: EnergyGate
  name: airtight energy gate
  suffix: Airtight
  components:
  - type: Airtight
  - type: RadiationBlocker
    resistance: 4
  - type: Sprite
    layers:
    - state: regular
    - state: idle
      shader: unshaded
      map: [ "barrier" ]
    - state: direction
      shader: unshaded
  - type: GenericVisualizer
    visuals:
      enum.TurnstileVisualLayers.Base:
        barrier:
          Idle: { state: idle }
          Spin: { state: operate }
          Deny: { state: deny }
  - type: PointLight
    energy: 2.2
    color: "#50abff"
    radius: 2.2
