- type: entity
  id: EnergyGate
  parent: BaseStructure
  name: energy gate
  description: An advanced gate that permits one-way access and prevents tailgating.
  components:
  - type: Sprite
    sprite: Structures/Doors/Misc/energy-gate.rsi
    drawdepth: Doors
    layers:
    - state: security
    - state: idle-security
      shader: unshaded
      map: [ "barrier" ]
    - state: direction
      shader: unshaded
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.TurnstileVisualLayers.Base:
        barrier:
          Idle: { state: idle-security }
          Spin: { state: operate }
          Deny: { state: deny }
  - type: AnimationPlayer
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,0.49" # same dimensions as a door for tall turnstile, prevents objects being thrown through
        density: 100
        mask:
        - FullTileMask
        layer:
        - GlassAirlockLayer
      fix2:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.50,-0.50,0.50,0.50" # same dimensions as a door for tall turnstile, prevents objects being thrown through
        hard: false
        mask:
        - FullTileMask
        layer:
        - GlassAirlockLayer
  - type: MeleeSound
    soundGroups:
      Brute:
        path:
          "/Audio/Weapons/smash.ogg"
  - type: InteractionOutline
  - type: Turnstile
    processWhitelist:
      components:
      - MobState # no mobs
      - Pullable # no dragging things in
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: StrongMetallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 500
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: AccessReader
  - type: Construction
