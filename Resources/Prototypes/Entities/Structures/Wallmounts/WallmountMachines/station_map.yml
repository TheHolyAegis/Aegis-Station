- type: entity
  parent: BaseWallmountMetallic
  id: StationMapAssembly
  name: station map assembly
  description: A station map assembly.
  components:
  - type: WallMount
    arc: 360
  - type: Sprite
    sprite: Structures/Wallmounts/station-map.rsi
    offset: 0, -0.25
    layers:
    - state: frame0
      map: [ "enum.ConstructionVisuals.Layer" ]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ConstructionVisuals.Key:
        enum.ConstructionVisuals.Layer:
          assembly: { state: frame0 }
          wired: { state: frame1 }
          electronics: { state: frame2 }
  - type: Construction
    graph: StationMap
    node: assembly
